<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Tarefas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <div class="app">

        <!-- ===================== BARRA LATERAL ===================== -->
        <aside class="sidebar">s

            <div class="sidebar-header">
                <span class="sidebar-title">Menu</span>
                <button class="toggle-mode" id="toggleMode" type="button">
                    <i class="bi bi-moon-stars-fill" id="toggleModeIcon"></i> Alternar Tema
                </button>
            </div>

            <div class="search-box">
                <i class="bi bi-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Buscar">
            </div>

            <div class="sidebar-section">
                <span class="sidebar-label">TAREFAS</span>

                <ul class="nav-list" id="taskNavList">
                    <li class="nav-item" data-view="upcoming">
                        <i class="bi bi-calendar2-week nav-icon"></i>
                        <span class="nav-name">Próximas</span>
                        <span class="badge" data-badge="upcoming">0</span>
                    </li>
                    <li class="nav-item active" data-view="today">
                        <i class="bi bi-sun nav-icon"></i>
                        <span class="nav-name">Hoje</span>
                        <span class="badge" data-badge="today">0</span>
                    </li>
                    <li class="nav-item" data-view="calendar">
                        <i class="bi bi-calendar3 nav-icon"></i>
                        <span class="nav-name">Calendário</span>
                    </li>
                    <li class="nav-item" data-view="sticky-wall">
                        <i class="bi bi-pin-angle nav-icon"></i>
                        <span class="nav-name">Mural</span>
                    </li>
                </ul>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-label">LISTAS</span>

                <ul class="nav-list" id="listNavList">
                    <li class="nav-item" data-view="personal">
                        <i class="bi bi-person nav-icon"></i>
                        <span class="nav-name">Pessoal</span>
                        <span class="badge" data-badge="personal">0</span>
                    </li>
                    <li class="nav-item" data-view="work">
                        <i class="bi bi-briefcase nav-icon"></i>
                        <span class="nav-name">Trabalho</span>
                        <span class="badge" data-badge="work">0</span>
                    </li>
                    <li class="nav-item" data-view="list1">
                        <i class="bi bi-journal-text nav-icon"></i>
                        <span class="nav-name">Lista 1</span>
                        <span class="badge" data-badge="list1">0</span>
                    </li>
                </ul>

                <button class="add-list-btn" id="addListBtn" type="button">
                    <i class="bi bi-plus-circle"></i> Nova Lista
                </button>
            </div>

            <div class="sidebar-section">
                <span class="sidebar-label">ETIQUETAS</span>
                <ul class="tag-list" id="tagList"></ul>
            </div>

        </aside>

        <!-- ===================== CONTEÚDO PRINCIPAL ===================== -->
        <main class="content">
            <div class="content-inner">

                <h1 class="page-title" id="pageTitle">Hoje</h1>

                <!-- Área normal de tarefas (formulário + filtros + lista) -->
                <div id="taskView">

                    <form id="taskForm" class="task-form">
                        <input type="text" id="taskTitleInput" placeholder="Nova Tarefa" maxlength="120" required>
                        <textarea id="taskDescInput" placeholder="Descrição" maxlength="255"></textarea>
                        <button type="submit" class="btn-add-task">
                            <i class="bi bi-plus-lg"></i> Adicionar Tarefa
                        </button>
                    </form>

                    <div class="filters" id="filters">
                        <button class="filter-pill active" data-filter="all">Todas</button>
                        <button class="filter-pill" data-filter="completed">Concluídas</button>
                        <button class="filter-pill" data-filter="pending">Pendentes</button>
                    </div>

                    <div class="task-list" id="taskList"></div>
                </div>

                <!-- Telas só visuais, por enquanto -->
                <div id="calendarView" class="placeholder-view">
                    <p><i class="bi bi-calendar3"></i> Calendário em construção...</p>
                </div>

                <div id="stickyWallView" class="placeholder-view">
                    <p><i class="bi bi-pin-angle"></i> Mural de notas em construção...</p>
                </div>

            </div>
        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
