<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
</head>
<body class="bg-light">

    <div class="d-flex justify-content-center align-items-center vh-100" id="loading">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Carregando...</span>
        </div>
    </div>

    <div class="container py-4 d-none" id="content">

        <p class="h1 text-center mb-4">Tarefas de um Usuário</p>

        <div class="row justify-content-center mb-4">
            <div class="col-md-4">
                <label for="userId" class="form-label">ID do Usuário</label>
                <div class="input-group">
                    <input type="number" min="1" class="form-control" id="userId" value="1">
                    <button class="btn btn-primary" id="loadUser" type="button">Carregar</button>
                </div>
            </div>
        </div>

        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>

        <div class="row justify-content-center mb-4">
            <div class="col-md-6">
                <label for="description" class="form-label">Nova Tarefa</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="description" placeholder="Descrição da tarefa" maxlength="255">
                    <button class="btn btn-success" id="addTask" type="button">Adicionar</button>
                </div>
            </div>
        </div>

        <table class="table table-hover">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Descrição</th>
                    <th scope="col" class="text-end">Ações</th>
                </tr>
            </thead>
            <tbody id="tasks"></tbody>
        </table>

    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+"
        crossorigin="anonymous">
    </script>
    <script src="script.js"></script>
</body>
</html>
